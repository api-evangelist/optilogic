apis:
- name: Optilogic REST API
  description: 'The Optilogic REST API exposes the Optilogic cloud platform to code: authenticate and refresh an API key, enumerate and inspect workspaces, queue and monitor Andromeda jobs (single, batch, back-to-back and search-and-run), read job ledgers and metrics, upload/download/copy/share files in the workspace /projects directory, manage SQL storage devices including connection strings, schema, tables, custom columns, custom tables, tags and labels, run database data exports, and store account secrets. Published as a Swagger 2.0 document with 67 operations and 99 definitions.'
  humanURL: https://api-docs.optilogic.app/documentation
  baseURL: https://api.optilogic.app/v0
