- name: Optilogic MCP Server (Ada Connector)
  description: Optilogic operates a hosted, remote Model Context Protocol server that backs the Ada connector for Claude. An MCP client points at https://mcp.optilogic.app/mcp and authenticates over OAuth 2.1 against the Optilogic Keycloak realm; once connected, the agent can name Cosmic Frog models, DataStar projects or other Postgres databases, and Ada attaches them and answers against them. The endpoint answers anonymously with HTTP 401 and an RFC 9728 WWW-Authenticate resource_metadata challenge, so the live tool list requires an authenticated session.
  humanURL: https://optilogic.com/resources/help-center/docs/getting-started-with-the-ada-claude-connector
  baseURL: https://mcp.optilogic.app/mcp
  tags:
  - MCP
