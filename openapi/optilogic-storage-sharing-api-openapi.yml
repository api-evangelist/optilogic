        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    format: string
                  error:
                    type: string
                    format: string
                  correlationId:
                    type: string
                    format: uuid
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    format: string
                  error:
                    type: string
                    format: string
                  correlationId:
                    type: string
                    format: uuid
