            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    format: string
                  error:
                    type: string
                    format: string
                  correlationId:
                    type: string
                    format: uuid
      security:
      - APIKeyHeader: []
  /storage/{storageName}/clone:
    post:
      tags:
      - 'storage : sharing'
      summary: Duplicates a storage
      description: ''
      parameters:
      - name: storageName
        in: path
        description: Name of the storage device to be duplicated
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    format: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
