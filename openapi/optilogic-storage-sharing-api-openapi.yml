                properties:
                  result:
                    type: string
                    format: string
                  error:
                    type: string
                    format: string
                  correlationId:
                    type: string
                    format: uuid
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    format: string
                  error:
                    type: string
                    format: string
                  correlationId:
                    type: string
                    format: uuid
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    format: string
                  error:
                    type: string
                    format: string
                  correlationId:
                    type: string
                    format: uuid
      security:
      - APIKeyHeader: []
  /storage/{storageName}/share/access:
    post:
      tags:
      - 'storage : sharing'
      summary: Shares storage access to a specified user
      description: ''
      parameters:
      - name: storageName
        in: path
        description: Name of the storage device to be shared
        required: true
        schema:
          type: string
      - name: targetUser
        in: query
        description: Username or email address of the user who will be assigned ownership of the storage device
        required: true
        schema:
          type: string
      - name: access
        in: query
        description: To govern read only access. Only 'readonly' will define read only share, anything else will give trusted access, including omitting the parameter.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    format: string
        '400':
          description: Bad Request
          content:
