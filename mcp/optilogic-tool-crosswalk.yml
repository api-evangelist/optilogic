divergence_note: These two surfaces are genuinely different products rather than two projections of one
  core. The REST API operates on workspaces, Andromeda jobs, files and SQL storage devices. The MCP server
  relays natural-language prompts to Ada against named Cosmic Frog / DataStar / Postgres databases. An
  agent that needs to queue a solve must use the REST API; an agent that needs to reason over a model
  database uses MCP. Neither can substitute for the other.
