tools_note: NOT RECORDED. Anonymous tools/list returns 401, so the live inputSchema set requires an authenticated
  introspection. The provider help centre describes the capability in prose only ("read-only tools (like
  listing databases)", "Show me what databases you have access to in Optilogic") and publishes no tool
  names, so nothing is derived here.
relationship_to_rest_api: The MCP server is NOT a projection of the REST API in openapi/. The REST API
  is a workspace/job/storage control plane; the MCP server fronts Ada, an agentic session over model databases.
  See mcp/optilogic-tool-crosswalk.yml.
